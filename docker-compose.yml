services:
  proxy-pool-manager:
    build:
      context: .
      args:
        SING_BOX_VERSION: "1.13.13"
    image: proxy-pool-manager:latest
    container_name: proxy-pool-manager
    restart: unless-stopped
    environment:
      PPM_HOST: "0.0.0.0"
      PPM_PORT: "9100"
      PPM_PROXY_LISTEN_HOST: "0.0.0.0"
      PPM_PROXY_PUBLIC_HOST: "${PPM_PROXY_PUBLIC_HOST:-}"
      PPM_CLASH_API_ADDR: "127.0.0.1:9090"
      PPM_DOMAIN_RESOLVE_STRATEGY: ""
      PPM_ASSET_VERSION: "20260716-traffic-pools"
      # Set this before exposing 9100 publicly.
      PPM_ADMIN_KEY: "${PPM_ADMIN_KEY:-}"
      # Set to 1 if the console is only accessed through HTTPS.
      PPM_COOKIE_SECURE: "${PPM_COOKIE_SECURE:-0}"
    volumes:
      - ./config:/app/config
      - ./tmp:/app/tmp
    ports:
      # Web console: keep it local and put HTTPS reverse proxy in front.
      - "127.0.0.1:9100:9100"
      # Proxy ports: expose only the range you assign to users.
      - "8001-8300:8001-8300"
